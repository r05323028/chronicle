# Chronicle workspace dependency architecture policy (version 1).
#
# Executable mirror of AGENTS.md crate architecture rules and
# docs/architecture/crate-boundaries.md (dependency edges) plus the
# semantic-boundary model ([semantic] table). The policy is a maximum-coupling
# allowlist: every allowed normal/dev/build Chronicle workspace edge is listed;
# unlisted workspace edges are forbidden. Deleting an allowed edge is always
# valid without editing policy. Adding a legitimate edge requires updating this
# file, AGENTS.md, and docs/architecture/crate-boundaries.md in the same change.
#
# Dependency kinds are validated independently: dev/build edges cannot bypass
# normal-layer architecture. Optional and target-specific declarations are
# checked from Cargo metadata independent of the current host platform.
# Package renames are evaluated by package identity, not by the rename string.

version = 1

[members]
# Every root-workspace Chronicle crate must appear here exactly once. A new
# workspace Chronicle crate without an entry fails validation until its
# responsibility and allowed direction are documented.
members = [
  "chronicle-application",
  "chronicle-canonical",
  "chronicle-capture",
  "chronicle-capture-ebpf",
  "chronicle-cli",
  "chronicle-common",
  "chronicle-etl",
  "chronicle-protocol",
  "chronicle-protocol-builtins",
  "chronicle-replay",
  "chronicle-session",
  "chronicle-storage",
  "chronicle-wal",
]

[critical_forbids]
# Named relationships that are forbidden in every dependency kind. Diagnostics
# name these explicitly in addition to the allowlist rule.
dependency_on_cli = true
session_to_wal = true
protocol_to_builtins = true
common_upward = true        # no other Chronicle crate may depend on common's dependents
cli_non_application = true  # CLI Chronicle edges may only target chronicle-application

[normal]
# Allowed normal (non-dev, non-build) workspace dependencies per source crate.
# Keys are source crates; values are allowed dependency target packages.
"chronicle-common" = []
"chronicle-canonical" = ["chronicle-common"]
"chronicle-capture" = ["chronicle-common"]
"chronicle-capture-ebpf" = ["chronicle-capture", "chronicle-common"]
"chronicle-wal" = ["chronicle-capture", "chronicle-common"]
"chronicle-session" = ["chronicle-capture", "chronicle-common"]
"chronicle-protocol" = [
  "chronicle-canonical",
  "chronicle-common",
  "chronicle-session",
]
"chronicle-protocol-builtins" = [
  "chronicle-canonical",
  "chronicle-common",
  "chronicle-protocol",
]
"chronicle-storage" = ["chronicle-canonical", "chronicle-common"]
"chronicle-replay" = [
  "chronicle-canonical",
  "chronicle-common",
  "chronicle-protocol",
]
"chronicle-etl" = [
  "chronicle-canonical",
  "chronicle-capture",
  "chronicle-common",
  "chronicle-protocol",
  "chronicle-session",
  "chronicle-storage",
  "chronicle-wal",
]
"chronicle-application" = [
  "chronicle-canonical",
  "chronicle-capture",
  "chronicle-capture-ebpf",
  "chronicle-common",
  "chronicle-etl",
  "chronicle-protocol",
  "chronicle-protocol-builtins",
  "chronicle-replay",
  "chronicle-session",
  "chronicle-storage",
  "chronicle-wal",
]
"chronicle-cli" = ["chronicle-application"]

[dev]
# Allowed dev-dependency workspace edges. Tests/build-support cannot bypass
# normal-layer architecture; only edges required for integration fixtures are
# listed.
"chronicle-common" = []
"chronicle-canonical" = []
"chronicle-capture" = []
"chronicle-capture-ebpf" = []
"chronicle-wal" = []
"chronicle-session" = []
"chronicle-protocol" = []
"chronicle-protocol-builtins" = []
"chronicle-storage" = []
"chronicle-replay" = []
"chronicle-etl" = ["chronicle-protocol-builtins"]
"chronicle-application" = ["chronicle-wal"]
"chronicle-cli" = []

[build]
# Allowed build-dependency workspace edges. Initially none.
"chronicle-common" = []
"chronicle-canonical" = []
"chronicle-capture" = []
"chronicle-capture-ebpf" = []
"chronicle-wal" = []
"chronicle-session" = []
"chronicle-protocol" = []
"chronicle-protocol-builtins" = []
"chronicle-storage" = []
"chronicle-replay" = []
"chronicle-etl" = []
"chronicle-application" = []
"chronicle-cli" = []

[semantic]
# Semantic/API boundary policy (beyond Cargo edges). Mirrors the
# "Semantic/API boundaries" section of docs/architecture/crate-boundaries.md.
# Dependency edges say which crate may depend on which crate; this table says
# which concepts and decisions may cross those edges. Enforcement lives in
# scripts/validation.py architecture (re-export scan + outer-adapter
# vocabulary scan) and is wired into validate.sh fast and release.
#
# forbidden_outer_vocabulary: symbols outer adapters (chronicle-cli today,
# future external adapters) MUST NOT name, construct, or pattern-match, even
# when reachable through application re-exports. Word-boundary exact matches.
forbidden_outer_vocabulary = [
  "LoopbackReplayOptions",
  "ReplayOutcome",
  "Replayability",
  "TimingMode",
  "OperationExecutionState",
  "ReplayError",
  "ProtocolError",
  "TransportErrorCategory",
]

# forbidden_re_export_sources: lower-layer crates whose public items
# chronicle-application MUST NOT re-export wholesale. chronicle-common neutral
# primitives remain allowed. A legitimate translated contract requires an
# allowed_re_exports entry with rationale plus a documentation update in the
# same change.
forbidden_re_export_sources = [
  "chronicle-replay",
  "chronicle-protocol",
  "chronicle-wal",
  "chronicle-etl",
  "chronicle-capture",
  "chronicle-session",
  "chronicle-storage",
  "chronicle-canonical",
  "chronicle-protocol-builtins",
  "chronicle-capture-ebpf",
]

# allowed_re_exports: reviewed per-symbol re-export allowlist (source crate
# and symbol plus rationale). Empty today; adding an entry requires the
# rationale and architecture documentation update in the same change.
allowed_re_exports = []

[external_dependencies]
# Direct package identities forbidden in neutral/domain crates. This guard is
# intentionally narrow: outer adapters may translate provider data, while
# generic logging/tracing facades remain allowed unless they are provider
# bridges. Cargo metadata supplies package identity, so renames and target-only
# declarations cannot evade the policy.
core_domain_crates = ["chronicle-common", "chronicle-canonical"]
forbidden_packages = [
  "opentelemetry",
  "opentelemetry-api",
  "opentelemetry-sdk",
  "opentelemetry-otlp",
  "opentelemetry-aws",
  "opentelemetry-datadog",
  "opentelemetry-jaeger",
  "opentelemetry-zipkin",
  "tracing-opentelemetry",
  "datadog-opentelemetry",
  "datadog-sdk",
  "aws-sdk-xray",
  "b3",
  "b3-opentelemetry",
  "opentelemetry-b3",
]
