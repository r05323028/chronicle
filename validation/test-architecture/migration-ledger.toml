# Chronicle test migration ledger (version 1)
#
# Responsibility-based classification of every significant existing test and
# assertion. Columns: id, path, purpose, current_layer, target_layer,
# environment, owner, surface, gates, disposition, destination,
# dependency_impact, rationale, verify.
#
# Functional layers: unit | integration | smoke | acceptance | e2e.
# Environment: portable | privileged.
# Dispositions: stay | move | split | delete_duplicate | deterministic_fixture
#   | make_rootless | remain_privileged | shared_lifecycle_migration.
#
# Baseline: validation/test-architecture/baseline.json (version 1, captured
# 2026-08-13, commit c326cc6). Drift vs planning snapshot (49 files / 487 test
# attributes): concurrent in-flight change added one colocated module and six
# test attributes; all 13 scenario IDs and 8 crate integration files unchanged.

version = 1
baseline = "validation/test-architecture/baseline.json"
captured = "2026-08-13"
commit = "c326cc6"

