# Chronicle classified test catalog (version 1)
#
# Machine-readable representation of the responsibility-based test architecture.
# Validation tooling selects and orchestrates these tests; live-capture/recorder/release are
# selectors over required coverage, not test categories.
#
# Functional layers (exclusive): unit | integration | smoke | acceptance | e2e.
# Environment dimension (orthogonal): portable | privileged.
# status: existing (present in checkout) | planned (added by a later task in
# this change; defined now so coverage mapping is explicit).

version = 1
layers = ["unit", "integration", "smoke", "acceptance", "e2e"]
environments = ["portable", "privileged"]
selectors = ["live-capture", "recorder", "release"]

