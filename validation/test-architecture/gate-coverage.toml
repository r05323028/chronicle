# Gate coverage matrix (version 1)
#
# Maps every current acceptance scenario, legacy check, milestone obligation, and
# retained evidence field to classified coverage so no required check can
# disappear during migration. P2 remains a P1 superset per the current evidence
# contract (scenarios.toml enforces p1 subset-of-p2).

version = 1
ledger = "validation/test-architecture/migration-ledger.toml"

# --- scenario -> classified coverage ---------------------------------------
# Each current scenario maps to the replacement coverage that must exist and
# pass before the scenario body is reduced or removed.

[scenario_coverage.capture-basic]
privileged = [
  "privileged capture integration: privileged_adapter.rs + privileged_feasibility.rs (--ignored)",
  "privileged acceptance: real eBPF attach/capture + cgroup placement/filtering sample",
]
portable = [
  "chronicle-wal unit suite (wal_fault/ingest matrices)",
  "chronicle-application unit bounds/ingest matrices",
  "eBPF unprivileged compile (groups.ebpf / CI ebpf-compile)",
]
composition = [
  "rootless E2E: synthetic capture -> WAL -> ETL -> canonical -> replay -> verify (task 5.1)",
]

[scenario_coverage.wal-recovery]
privileged = []
portable = [
  "chronicle-wal integration recovery matrices",
  "chronicle-etl integration idempotence (3.2/3.3)",
]
composition = []

[scenario_coverage.replay]
privileged = ["privileged capture-to-replay sample (very few)"]
portable = [
  "chronicle-replay unit matrices (3.4)",
  "acceptance: public inspect/replay (4.2)",
]
composition = ["rootless E2E: record/inspect/replay through binary (5.1)"]

[scenario_coverage.user-intent-lifecycle]
privileged = [
  "privileged acceptance: real cgroup selection + eBPF cleanup + process attribution",
]
portable = ["cgroup_selection unit matrices"]
composition = []

[scenario_coverage.cli-compatibility]
privileged = [
  "privileged sample: real capture output consumed by compatibility forms",
]
portable = [
  "cli_contract.rs integration + acceptance: public CLI contract (4.2)",
]
composition = []

[scenario_coverage.resource-cleanup]
privileged = ["privileged: cgroup/eBPF/systemd cleanup + privileged_signal.rs"]
portable = [
  "cgroup decision unit matrices",
  "repo checks (fmt/workspace) as independent steps",
]
composition = []

[scenario_coverage.recorder-readiness]
privileged = [
  "privileged acceptance: real systemd freshness/stale-owner/terminal readiness",
]
portable = []
composition = []

[scenario_coverage.incremental-etl]
privileged = []
portable = [
  "chronicle-etl incremental/publication/one-shot-equivalence integration (3.3)",
]
composition = []

[scenario_coverage.checkpoint-kill-restart]
privileged = ["privileged: real process kill/restart convergence under systemd"]
portable = ["chronicle-etl checkpoint transaction/fault matrix (3.3)"]
composition = []

[scenario_coverage.quota-pressure]
privileged = [
  "privileged: loop device/mount/systemd quota pressure entry+recovery",
]
portable = ["chronicle-application recorder_quota unit accounting matrices"]
composition = []

[scenario_coverage.retention-interruption]
privileged = ["privileged: real cleanup interruption/recovery under systemd"]
portable = ["chronicle-wal retention decision/policy unit matrices"]
composition = []

[scenario_coverage.corruption-quarantine]
privileged = []
portable = [
  "chronicle-etl integration: deterministic copied-WAL corruption fail-closed/preservation (3.3)",
]
composition = []

[scenario_coverage.reboot-recovery]
privileged = ["privileged: real VM reboot continuity (pre/post boot-id)"]
portable = []
composition = []

# --- legacy checks -> owning classified coverage ----------------------------

[legacy_check_mapping]
privileged_acceptance = "privileged capture integration (privileged_adapter/feasibility + capture-basic privileged sample)"
wal_fault_matrix = "chronicle-wal unit + integration:chronicle-wal-matrix (deterministic real WAL files, portable)"
ingest_limit_matrix = "chronicle-application unit (portable)"
replay_matrix = "chronicle-replay unit (portable)"
cgroup_matrix = "chronicle-application cgroup_selection unit (portable)"
privileged_signal = "chronicle-cli privileged_signal integration (privileged)"
format_check = "cargo fmt --all --check (portable repository check)"
workspace_check = "cargo check --workspace --all-targets --locked (portable repository check)"
systemd_type_simple = "recorder-readiness privileged acceptance"
three_epochs = "capture-basic privileged capture integration"
checkpoint_output_committed_checkpoint_missing = "chronicle-etl checkpoint unit + chronicle-application tests/etl_contract.rs idempotence (portable) + checkpoint-kill-restart privileged sample"
checkpoint_committed_status_missing = "chronicle-etl checkpoint unit + chronicle-application tests/etl_contract.rs idempotence (portable) + checkpoint-kill-restart privileged sample"
incremental_worker = "chronicle-etl incremental integration (portable) + incremental-etl privileged sample"
standalone_etl_live_rejection = "chronicle-etl integration (portable)"
one_shot_equivalence = "chronicle-etl publication unit + chronicle-application tests/etl_contract.rs cross-output equivalence (portable)"
inspect_replay = "acceptance public inspect/replay (4.2) + privileged sample"
quota_exhaustion_admission = "quota-pressure privileged + recorder_quota unit"
quota_restart_accounting = "quota-pressure privileged + recorder_quota unit"
quota_recovery_after_space = "quota-pressure privileged + recorder_quota unit"
minimum_free_enforcement = "quota-pressure privileged + recorder_quota unit"
minimum_free_recovery = "quota-pressure privileged + recorder_quota unit"
cleanup_interrupted_recovery = "retention-interruption privileged + chronicle-wal retention unit"
cleanup_protected_lineage = "retention-interruption privileged + chronicle-wal retention unit"
cleanup_restart_consistency = "retention-interruption privileged + chronicle-wal retention unit"
corruption_fail_closed = "chronicle-etl unit + chronicle-application tests/etl_contract.rs corruption fail-closed (portable)"
corruption_evidence_preservation = "chronicle-etl unit + chronicle-application tests/etl_contract.rs preservation (portable)"
pre_reboot_persistence = "reboot-recovery privileged"
host_reboot_recovery = "reboot-recovery privileged"
user_intent_lifecycle = "privileged acceptance (cgroup/eBPF lifecycle) + cgroup_selection unit"
cli_compatibility = "cli_contract integration + acceptance public CLI (portable) + privileged sample"
resource_cleanup = "privileged cgroup/eBPF/systemd cleanup + cgroup decision unit"
signal_shutdown = "privileged_signal integration (privileged) + cli_contract portable exit mapping"
process_restart_readiness = "recorder-readiness privileged + portable unit/integration readiness contracts"

# --- milestone gate obligations ---------------------------------------------
# P1/P2 are selectors over classified coverage, not test categories. P2 keeps
# P1 subset semantics per scenarios.toml (report.load_scenarios enforces it).

[obligations.p1]
portable = [
  "unit: all 42 colocated modules (cargo test --workspace)",
  "integration: application vertical slices, cli_contract, tooling self-tests",
  "repository: fmt, clippy, openspec, source-ownership, architecture, eBPF compile",
  "smoke: executable liveness (4.1, after migration)",
  "acceptance: public record/inspect/ETL/replay features (4.2, after migration)",
  "e2e: rootless synthetic pipeline (5.1, after migration)",
]
privileged = [
  "privileged capture integration (real eBPF attach/capture)",
  "privileged acceptance samples (cgroup policy, user-intent, cli-compat, cleanup)",
  "privileged signal handling",
]

[obligations.p2]
portable = ["all p1 portable coverage"]
privileged = [
  "all p1 privileged coverage",
  "recorder readiness under real systemd",
  "checkpoint kill/restart convergence",
  "quota pressure with real loop/mount",
  "retention interruption under real systemd",
  "reboot recovery",
]

[obligations.release]
notes = [
  "complete portable hierarchy + complete privileged evidence from clean identifiable checkout",
  "content-addressed compatible reuse remains valid; unsupported/infrastructure/timeout/incomplete evidence never satisfies release",
]

# --- retained evidence contract ----------------------------------------------
# Existing evidence/report fields remain authoritative; task 9.4 extends them
# with classified functional-layer and preflight/infrastructure outcomes.

[evidence]
baseline_fields = "validation/test-architecture/baseline.json -> evidence_report_fields"
schema = "scripts/acceptance/report.py SCHEMA_VERSION 3 / COMPATIBILITY_VERSION 2 (unchanged this session)"
invariants = [
  "fingerprint content-addressing (validation.py fingerprint / acceptance_fingerprint)",
  "same-run source stability + clean release checkout identity",
  "complete manifest + checksums + scenario attribution passed/failed/not_checked",
  "timeout records reject reuse",
  "P1 subset of P2; P1 evidence never satisfies P2",
]
