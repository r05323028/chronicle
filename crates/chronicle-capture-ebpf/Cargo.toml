[package]
name = "chronicle-capture-ebpf"
publish.workspace = true
repository.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
linux-ebpf = ["dep:aya", "dep:aya-obj", "dep:libc"]

[dependencies]
chronicle-capture = { path = "../chronicle-capture" }
chronicle-common = { path = "../chronicle-common" }
sha2.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
aya = { version = "0.14", optional = true }
aya-obj = { version = "0.3", optional = true }
libc = { version = "0.2", optional = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true

[lints]
workspace = true
