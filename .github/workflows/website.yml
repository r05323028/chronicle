name: Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "README.md"
      - "docs/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/chronicle-cli/**"
      - "scripts/release/**"
      - "install.sh"
      - ".github/workflows/website.yml"
  pull_request:
    paths:
      - "website/**"
      - "README.md"
      - "docs/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/chronicle-cli/**"
      - "scripts/release/**"
      - "install.sh"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: website-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build:
    name: Validate and build website
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Configure Astro deployment base
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY##*/}"
          owner="$(printf '%s' "$owner" | tr '[:upper:]' '[:lower:]')"
          {
            echo "SITE=https://${owner}.github.io"
            echo "BASE_PATH=/${repo}"
          } >> "$GITHUB_ENV"

      - name: Verify documentation localization
        working-directory: website
        run: npm run verify:localization

      - name: Verify committed documentation versions
        working-directory: website
        run: npm run verify:versions

      - name: Type-check Astro and Starlight
        working-directory: website
        run: npm run check

      - name: Build static site
        working-directory: website
        run: npm run build

      - name: Verify static output
        working-directory: website
        run: npm run verify:build

      - name: Assert build did not mutate source
        shell: bash
        run: |
          set -euo pipefail
          source_paths=(
            website/astro.config.mjs
            website/src/content/docs
            website/src/content/i18n
            website/src/content/versions
          )
          if [[ -n "$(git status --short -- "${source_paths[@]}")" ]]; then
            echo 'Website build modified committed source;' >&2
            echo 'Deployment stopped.' >&2
            git status --short -- "${source_paths[@]}"
            exit 1
          fi

      - name: Upload Pages artifact
        # act (local pre-push hook) sets ACT=true and has no Pages artifact
        # service; keep the upload for GitHub-hosted runs only.
        if: >-
          !env.ACT &&
          (github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main'))
        uses: >-
          actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: website/dist

  deploy:
    name: Deploy website to GitHub Pages
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main')
    needs: validate-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
