name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Cache Cargo dependencies and build output
        uses: actions/cache@6849a6489940f00c2f30c0fb92c6274307ccb58a
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check toolchain
        run: rustup show active-toolchain

      - name: Run fast layered validation
        run: ./scripts/validate.sh fast

      - name: Build CLI binary
        run: cargo build -p chronicle-cli --locked

      - name: Portable smoke and rootless coverage
        run: |
          python3 tests/smoke/test_smoke.py
          python3 tests/smoke/test_documented_commands.py
          python3 tests/acceptance/test_record.py
          python3 tests/acceptance/test_inspect.py
          python3 tests/acceptance/test_replay.py
          python3 tests/e2e/test_rootless_pipeline.py
          python3 tests/support/test_http_driver.py

      - name: Validate layered tooling
        run: |
          python3 scripts/tests/validation/test_layered_validation.py
          python3 scripts/tests/acceptance/test_runner.py
          bash scripts/tests/acceptance/test-p2-readiness.sh

      - name: Upload failure-only validation evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validation-failure-${{ github.run_id }}
          path: target/validation-evidence/
          if-no-files-found: ignore
          retention-days: 14

  ebpf-compile:
    name: eBPF compile (unprivileged)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # Full history so the tracked-object freshness check can compare
          # the last commit touching ebpf/ source with the object's commit.
          fetch-depth: 0

      - name: Install eBPF build toolchain
        run: |
          rustup toolchain install nightly --profile minimal \
            --component rust-src
          cargo +nightly install bpf-linker --locked

      - name: Compile eBPF capture
        run: |
          cargo +nightly build -Z build-std=core \
            --manifest-path ebpf/Cargo.toml \
            --target bpfel-unknown-none --release --locked
          echo "Compile success is unprivileged only;"
          echo "privileged runtime hook behavior is not checked."

      - name: Assert tracked fallback eBPF object is current
        run: |
          set -euo pipefail
          tracked=crates/chronicle-capture-ebpf/objects/chronicle-ebpf-capture-bpfel.o
          tracked_last=$(git log -1 --format=%H -- "$tracked")
          src_last=$(
            git log -1 --format=%H -- ebpf/src ebpf/Cargo.toml \
              ebpf/rust-toolchain.toml ebpf/.cargo
          )
          if [[ -z "$src_last" ]] ||
            git merge-base --is-ancestor "$src_last" "$tracked_last"; then
            echo "Tracked fallback eBPF object is current with ebpf/ source"
          else
            echo "Tracked fallback eBPF object drifts from ebpf/ source."
            echo "Regenerate it from the current source and commit together:"
            echo "  cargo +nightly build -Z build-std=core \\"
            echo "    --manifest-path ebpf/Cargo.toml \\"
            echo "    --target bpfel-unknown-none --release --locked"
            echo "  cp ebpf/target/bpfel-unknown-none/release/ \\"
            echo "    chronicle-ebpf-capture \\"
            echo "    crates/chronicle-capture-ebpf/objects/ \\"
            echo "    chronicle-ebpf-capture-bpfel.o"
            echo "Byte comparison is not used: the embedded object carries"
            echo "absolute build paths and nightly codegen varies by toolchain."
            exit 1
          fi
