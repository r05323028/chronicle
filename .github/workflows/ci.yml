name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Cache Cargo dependencies and build output
        uses: actions/cache@6849a6489940f00c2f30c0fb92c6274307ccb58a
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check toolchain
        run: rustup show active-toolchain

      - name: Run fast layered validation
        run: ./scripts/validate.sh fast

      - name: Validate layered tooling
        run: |
          python3 scripts/tests/validation/test_layered_validation.py
          bash scripts/tests/acceptance/test-p2-readiness.sh

      # Cargo directories above are caches, never evidence artifacts.
      - name: Upload failure-only validation evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validation-failure-${{ github.run_id }}
          path: |
            evidence/validation/
            target/validation-work/
          if-no-files-found: ignore
          retention-days: 14

  ebpf-compile:
    name: eBPF compile (unprivileged)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install eBPF build toolchain
        run: |
          rustup toolchain install nightly --profile minimal \
            --component rust-src
          cargo +nightly install bpf-linker --locked

      - name: Compile eBPF capture
        run: |
          cargo +nightly build -Z build-std=core \
            --manifest-path ebpf/Cargo.toml \
            --target bpfel-unknown-none --release --locked
          echo "Compile success is unprivileged only;"
          echo "privileged runtime hook behavior is not checked."
