name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Build and publish chronicle-${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install eBPF build toolchain
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) bpf_arch=x86_64 ;;
            aarch64 | arm64) bpf_arch=aarch64 ;;
            *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          rustup toolchain install nightly --profile minimal \
            --component rust-src
          curl -fsSL -o /tmp/bpf-linker.tar.zst \
            "https://github.com/aya-rs/bpf-linker/releases/download/v0.11.0/bpf-linker-${bpf_arch}-unknown-linux-musl.tar.zst"
          tar --zstd -xf /tmp/bpf-linker.tar.zst -C /tmp
          sudo mv /tmp/bpf-linker /usr/local/bin/bpf-linker
          bpf-linker --version

      - name: Compile eBPF capture from source
        run: |
          cargo +nightly build -Z build-std=core \
            --manifest-path ebpf/Cargo.toml \
            --target bpfel-unknown-none --release --locked

      - name: Build chronicle release binary with linux-ebpf
        run: >-
          cargo build -p chronicle-cli --release
          --features linux-ebpf --locked

      - name: Validate release binary
        run: |
          set -euo pipefail
          ./target/release/chronicle --version
          ./target/release/chronicle --help |
            grep -E 'record|replay|list|inspect|doctor' >/dev/null
          python3 - <<'PY'
          import json, subprocess, sys
          report = json.loads(
              subprocess.check_output(
                  ["./target/release/chronicle", "--format", "json",
                   "doctor"],
                  text=True,
              )
          )
          probes = {p["code"]: p["status"] for p in report["probes"]}
          for code in ("capture.object", "capture.programs"):
              status = probes.get(code)
              if status != "supported":
                  sys.exit(
                      f"release artifact missing embedded eBPF object: "
                      f"{code}={status}"
                  )
          print("release binary: version, help, eBPF object validated")
          PY

      - name: Package archive
        run: |
          set -euo pipefail
          VERSION=$(
            grep -m1 '^version' Cargo.toml |
            sed -E 's/version *= *"([^"]+)".*/\1/'
          )
          mkdir -p dist
          cp target/release/chronicle dist/chronicle
          cp LICENSE dist/LICENSE
          cp README.md dist/README.md
          tar -C dist -czf \
            "dist/chronicle-${VERSION}-${TARGET}.tar.gz" \
            chronicle LICENSE README.md
          rm dist/chronicle dist/LICENSE dist/README.md
        env:
          TARGET: ${{ matrix.target }}

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ matrix.target }}
          path: dist/chronicle-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Create GitHub Release
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/chronicle-*.tar.gz --generate-notes

  checksums:
    name: Compose release checksums
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release archives
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$GITHUB_REF_NAME" \
            --pattern 'chronicle-*.tar.gz' \
            --dir dist

      - name: Compose and verify SHA256SUMS
        run: |
          set -euo pipefail
          (cd dist && sha256sum chronicle-*.tar.gz > SHA256SUMS)
          cat dist/SHA256SUMS
          sha256sum -c dist/SHA256SUMS

      - name: Upload checksums
        run: >-
          gh release upload "$GITHUB_REF_NAME"
          dist/SHA256SUMS --clobber
