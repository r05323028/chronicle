name: Release

on:
  push:
    tags:
      - "v*"
  # Manual trigger = release dry run: exercises the full preparation path
  # (build, notes, archives, checksums, bundle) but never publishes.
  workflow_dispatch:

permissions:
  contents: read

env:
  # Release-note generation (Pi + OpenCode Go). Non-secret values live here so
  # the jobs reference them without duplicating literals. The API key is NOT a
  # workflow env: it stays in the OPENCODE_GO_API_KEY secret and is injected
  # only into the step that talks to the provider.
  OPENCODE_GO_BASE_URL: https://opencode.ai/zen/go/v1
  RELEASE_NOTES_MODEL: deepseek-v4-flash
  RELEASE_NOTES_THINKING_LEVEL: off

jobs:
  resolve-context:
    name: Resolve release context
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      is-release: ${{ steps.resolve.outputs.is-release }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Resolve mode, version and intended tag
        id: resolve
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              MODE=release
              TAG="$GITHUB_REF_NAME"
            else
              MODE=dry-run
              TAG=""
            fi
          else
            MODE=dry-run
            TAG=""
          fi
          ./scripts/release/resolve-release-context.sh \
            "$MODE" Cargo.toml "$TAG" >> "$GITHUB_OUTPUT"

  release:
    name: Build chronicle-${{ matrix.target }}
    needs: resolve-context
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install eBPF build toolchain
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) bpf_arch=x86_64 ;;
            aarch64 | arm64) bpf_arch=aarch64 ;;
            *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          rustup toolchain install nightly --profile minimal \
            --component rust-src
          curl -fsSL -o /tmp/bpf-linker.tar.zst \
            "https://github.com/aya-rs/bpf-linker/releases/download/v0.11.0/bpf-linker-${bpf_arch}-unknown-linux-musl.tar.zst"
          tar --zstd -xf /tmp/bpf-linker.tar.zst -C /tmp
          sudo mv /tmp/bpf-linker /usr/local/bin/bpf-linker
          bpf-linker --version

      - name: Compile eBPF capture from source
        run: |
          cargo +nightly build -Z build-std=core \
            --manifest-path ebpf/Cargo.toml \
            --target bpfel-unknown-none --release --locked

      - name: Build chronicle release binary with linux-ebpf
        run: >-
          cargo build -p chronicle-cli --release
          --features linux-ebpf --locked

      - name: Validate release binary
        run: |
          set -euo pipefail
          ./target/release/chronicle --version
          ./target/release/chronicle --help |
            grep -E 'record|replay|list|inspect|doctor' >/dev/null
          python3 - <<'PY'
          import json, subprocess, sys
          proc = subprocess.run(
              ["./target/release/chronicle", "--format", "json",
               "doctor"],
              capture_output=True,
              text=True,
          )
          # doctor's exit code reflects the runner's kernel/privilege
          # environment (BTF, cgroup v2, CAP_BPF), not artifact health.
          # The embedded capture object probes below are the artifact gate.
          report = json.loads(proc.stdout)
          probes = {p["code"]: p["status"] for p in report["probes"]}
          for code in ("capture.object", "capture.programs"):
              status = probes.get(code)
              if status != "supported":
                  sys.exit(
                      f"release artifact missing embedded eBPF object: "
                      f"{code}={status}"
                  )
          print(
              "release binary: version, help, eBPF object validated "
              f"(doctor exit {proc.returncode})"
          )
          PY

      - name: Package archive
        run: |
          set -euo pipefail
          VERSION=$(
            grep -m1 '^version' Cargo.toml |
            sed -E 's/version *= *"([^"]+)".*/\1/'
          )
          mkdir -p dist
          cp target/release/chronicle dist/chronicle
          cp LICENSE dist/LICENSE
          cp README.md dist/README.md
          tar -C dist -czf \
            "dist/chronicle-${VERSION}-${TARGET}.tar.gz" \
            chronicle LICENSE README.md
          rm dist/chronicle dist/LICENSE dist/README.md
        env:
          TARGET: ${{ matrix.target }}

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ matrix.target }}
          path: dist/chronicle-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  release-notes:
    name: Generate release notes with Pi
    needs: [resolve-context, release]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository with full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # Full history so the agent can resolve the current and previous
          # release tags itself from the checked-out repository.
          fetch-depth: 0

      - name: Configure OpenCode Go provider
        run: python3 scripts/release/write-opencode-go-models-json.py

      - name: Load release-note prompt
        id: prompt
        run: |
          {
            echo "prompt<<CHRONICLE_PROMPT_EOF"
            cat .github/prompts/release-notes.md
            echo "CHRONICLE_PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate release notes with Pi
        id: generate
        uses: shaftoe/pi-coding-agent-action@v2.27.0
        env:
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
        with:
          github_token: ${{ github.token }}
          provider: opencode-go
          model: ${{ env.RELEASE_NOTES_MODEL }}
          thinking_level: ${{ env.RELEASE_NOTES_THINKING_LEVEL }}
          load_builtin_extensions: false
          prompt: ${{ steps.prompt.outputs.prompt }}

      - name: Save generated release notes
        run: |
          cat > release-notes.md <<'CHRONICLE_NOTES_EOF'
          ${{ steps.generate.outputs.response }}
          CHRONICLE_NOTES_EOF
          test -s release-notes.md

      - name: Upload release notes artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 7

  prepare-release:
    name: Prepare release artifacts
    needs: [resolve-context, release, release-notes]
    runs-on: ubuntu-latest
    steps:
      - name: Download release archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: prepared-release
          merge-multiple: true

      - name: Download release notes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-notes
          path: prepared-release

      - name: Verify expected artifacts
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve-context.outputs.version }}"
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            archive="prepared-release/chronicle-${VERSION}-${target}.tar.gz"
            [[ -f "$archive" ]] || {
              echo "missing expected archive: $archive" >&2
              exit 1
            }
          done
          [[ -f prepared-release/release-notes.md ]] || {
            echo "missing release-notes.md" >&2
            exit 1
          }
          echo "expected artifacts present:"
          ls -1 prepared-release/

      - name: Generate and verify SHA256SUMS
        run: |
          set -euo pipefail
          (
            cd prepared-release
            sha256sum chronicle-*.tar.gz > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
          echo "SHA256SUMS verified"
          cat prepared-release/SHA256SUMS

      - name: Write release preparation summary
        run: |
          set -euo pipefail
          MODE="${{ needs.resolve-context.outputs.mode }}"
          VERSION="${{ needs.resolve-context.outputs.version }}"
          TAG="${{ needs.resolve-context.outputs.tag }}"
          ARCHIVES=$(basename -a prepared-release/chronicle-*.tar.gz \
            | tr '\n' ' ')
          {
            echo "## Release preparation summary"
            echo ""
            echo "- Mode: ${MODE}"
            echo "- Resolved workspace version: ${VERSION}"
            echo "- Intended release tag: ${TAG}"
            echo "- Generated archives: ${ARCHIVES}"
            echo "- release-notes.md: present"
            echo "- SHA256SUMS: present and verified"
            if [[ "$MODE" == "dry-run" ]]; then
              echo "- Publication: SKIPPED (dry run)"
              echo ""
              echo "Dry run completed successfully."
              echo "No GitHub Release was created."
            else
              echo "- Publication: deferred to publish job (tag push)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload prepared release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prepared-release
          path: prepared-release
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Create GitHub Release
    # Real-release boundary: publication happens only for a pushed v* tag.
    # A workflow_dispatch run is a dry run: gh release create is unreachable.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [resolve-context, prepare-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download prepared release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: prepared-release
          path: .

      - name: Publish GitHub Release
        run: >-
          gh release create "${{ needs.resolve-context.outputs.tag }}"
          chronicle-*.tar.gz SHA256SUMS
          --notes-file release-notes.md
          --verify-tag

      - name: Assert SHA256SUMS is attached to the release
        run: >-
          gh release view "${{ needs.resolve-context.outputs.tag }}"
          --json assets --jq '.assets[].name'
          | grep -qx SHA256SUMS

      - name: Write publication summary
        run: |
          {
            echo "## Release published"
            echo ""
            echo "- Tag: ${{ needs.resolve-context.outputs.tag }}"
            echo "- Version: ${{ needs.resolve-context.outputs.version }}"
          } >> "$GITHUB_STEP_SUMMARY"
