name: Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: >-
          Release mode: prepare is non-mutating; release promotes and publishes
        required: true
        type: choice
        options:
          - prepare
          - release
        default: prepare
      version:
        description: Workspace release version, for example 0.2.0 or 0.2.0-rc.1
        required: true
        type: string

concurrency:
  group: chronicle-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve-context:
    name: Freeze and resolve release context
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      is-release: ${{ steps.resolve.outputs.is-release }}
      is-prerelease: ${{ steps.resolve.outputs.is-prerelease }}
      sha: ${{ steps.resolve.outputs.sha }}
      tag-exists: ${{ steps.state.outputs.tag-exists }}
      release-state: ${{ steps.state.outputs.release-state }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out frozen workflow SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}

      - name: Freeze SHA and resolve requested version
        id: resolve
        env:
          RELEASE_MODE: ${{ inputs.mode }}
          REQUESTED_VERSION: ${{ inputs.version }}
          WORKFLOW_EVENT: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$WORKFLOW_EVENT" == workflow_dispatch ]] || {
            echo "release workflow requires workflow_dispatch" >&2
            exit 1
          }
          [[ "$WORKFLOW_REF" == refs/heads/main ]] || {
            echo "release workflow may run only from refs/heads/main" >&2
            exit 1
          }
          frozen_sha=$(git rev-parse HEAD)
          [[ "$frozen_sha" == "$WORKFLOW_SHA" ]] || {
            echo "checkout does not match github.sha:" \
              "$frozen_sha != $WORKFLOW_SHA" >&2
            exit 1
          }
          ./scripts/release/resolve-release-context.sh \
            "$RELEASE_MODE" Cargo.toml "$REQUESTED_VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$WORKFLOW_SHA" >> "$GITHUB_OUTPUT"

      - name: Require committed documentation snapshot
        env:
          RELEASE_VERSION: ${{ steps.resolve.outputs.version }}
        run: node website/scripts/verify-release-docs.mjs "$RELEASE_VERSION"

      - name: Reject conflicting tag or release state
        id: state
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          scripts/release/manage-release-state.sh inspect "$TAG" "$SHA" \
            >> "$GITHUB_OUTPUT"

  release-qualification:
    name: Canonical release qualification
    needs: resolve-context
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out frozen release candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install OpenSpec CLI
        run: npm install -g @fission-ai/openspec@1.9.0

      - name: Prepare Multipass guest for canonical acceptance
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          command -v multipass >/dev/null 2>&1 || \
            sudo snap install multipass --classic
          sudo snap restart multipass.multipassd || true
          timeout 180 bash -c \
            'until sudo multipass list >/dev/null 2>&1; do sleep 3; done'
          timeout 300 sudo multipass find
          timeout 600 sudo multipass launch 24.04 \
            --name chronicle-release --cpus 2 --memory 6G --disk 20G
          test "$(sudo multipass exec chronicle-release -- uname -m)" = x86_64

      - name: Run canonical release qualification
        run: ./scripts/validate.sh release --vm chronicle-release --force

      - name: Upload release qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-qualification-evidence-${{ github.run_id }}
          path: target/validation-evidence/
          if-no-files-found: warn
          retention-days: 30

  release:
    name: Build chronicle-${{ matrix.target }}
    needs: [resolve-context, release-qualification]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - name: Check out frozen release candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}

      - name: Install eBPF build toolchain
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) bpf_arch=x86_64 ;;
            aarch64 | arm64) bpf_arch=aarch64 ;;
            *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          rustup toolchain install nightly --profile minimal \
            --component rust-src
          curl -fsSL -o /tmp/bpf-linker.tar.zst \
            "https://github.com/aya-rs/bpf-linker/releases/download/v0.11.0/"\
            "bpf-linker-${bpf_arch}-unknown-linux-musl.tar.zst"
          tar --zstd -xf /tmp/bpf-linker.tar.zst -C /tmp
          sudo mv /tmp/bpf-linker /usr/local/bin/bpf-linker
          bpf-linker --version

      - name: Compile eBPF capture from source
        run: |
          cargo +nightly build -Z build-std=core \
            --manifest-path ebpf/Cargo.toml \
            --target bpfel-unknown-none --release --locked

      - name: Build chronicle release binary
        # Linux targets include live eBPF capture automatically.
        run: cargo build -p chronicle-cli --release --locked

      - name: Validate release binary
        run: |
          set -euo pipefail
          ./target/release/chronicle --version
          ./target/release/chronicle --help |
            grep -E 'record|replay|list|inspect|doctor' >/dev/null
          python3 - <<'PY'
          import json, subprocess, sys
          proc = subprocess.run(
              ["./target/release/chronicle", "--format", "json", "doctor"],
              capture_output=True,
              text=True,
          )
          # doctor's exit code reflects runner kernel/privilege support, not
          # artifact health. Embedded capture probes gate the artifact.
          report = json.loads(proc.stdout)
          probes = {p["code"]: p["status"] for p in report["probes"]}
          for code in ("capture.object", "capture.programs"):
              status = probes.get(code)
              if status != "supported":
                  sys.exit(
                      f"release artifact missing embedded eBPF object: "
                      f"{code}={status}"
                  )
          print(
              "release binary: version, help, eBPF object validated "
              f"(doctor exit {proc.returncode})"
          )
          PY

      - name: Package archive
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.resolve-context.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/chronicle dist/chronicle
          cp LICENSE dist/LICENSE
          cp README.md dist/README.md
          tar -C dist -czf \
            "dist/chronicle-${VERSION}-${TARGET}.tar.gz" \
            chronicle LICENSE README.md
          rm dist/chronicle dist/LICENSE dist/README.md

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ matrix.target }}
          path: dist/chronicle-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  release-notes:
    name: Generate deterministic release notes
    needs: [resolve-context, release]
    runs-on: ubuntu-latest
    steps:
      - name: Check out frozen release candidate with full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install git-cliff 2.13.1
        env:
          GIT_CLIFF_VERSION: 2.13.1
          GIT_CLIFF_SHA512: >-
            e716cce3a07dda41b1e370d6afbd7a59eb3d4739509fb7856aeec8da2be28c0396584e29e106141c1a1c535c1827dbc1f60417524f5cfb1da9e11f700bd00f30
        run: |
          set -euo pipefail
          archive="git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          archive_path="$RUNNER_TEMP/$archive"
          url="https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/${archive}"
          curl --fail --silent --show-error --location --proto '=https' \
            --tlsv1.2 --output "$archive_path" "$url"
          printf '%s  %s\n' "$GIT_CLIFF_SHA512" "$archive_path" |
            sha512sum --check --status -
          mkdir -p "$RUNNER_TEMP/git-cliff" "$RUNNER_TEMP/bin"
          tar --extract --gzip --file "$archive_path" \
            --directory "$RUNNER_TEMP/git-cliff" --strip-components=1
          install -m 0755 "$RUNNER_TEMP/git-cliff/git-cliff" \
            "$RUNNER_TEMP/bin/git-cliff"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          git-cliff --version | grep -Fx "git-cliff ${GIT_CLIFF_VERSION}"

      - name: Resolve previous release boundary
        id: range
        env:
          VERSION: ${{ needs.resolve-context.outputs.version }}
          TAG: ${{ needs.resolve-context.outputs.tag }}
          SHA: ${{ needs.resolve-context.outputs.sha }}
        run: |
          set -euo pipefail
          python3 scripts/release/resolve-release-range.py \
            "$VERSION" "$TAG" "$SHA" >> "$GITHUB_OUTPUT"

      - name: Generate release-notes.md from frozen history
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve-context.outputs.tag }}
          RELEASE_RANGE: ${{ steps.range.outputs.range }}
        run: |
          set -euo pipefail
          git-cliff --config cliff.toml --github-repo "$GITHUB_REPO" \
            --tag "$TAG" --output release-notes.md "$RELEASE_RANGE"
          test -s release-notes.md
          grep -q "^## What's Changed$" release-notes.md

      - name: Upload release notes artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 7

  prepare-release:
    name: Prepare release artifacts
    needs: [resolve-context, release-qualification, release, release-notes]
    runs-on: ubuntu-latest
    steps:
      - name: Download release archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: prepared-release
          merge-multiple: true

      - name: Download release notes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-notes
          path: prepared-release

      - name: Verify expected artifacts
        env:
          VERSION: ${{ needs.resolve-context.outputs.version }}
        run: |
          set -euo pipefail
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            archive="prepared-release/chronicle-${VERSION}-${target}.tar.gz"
            [[ -f "$archive" ]] || {
              echo "missing expected archive: $archive" >&2
              exit 1
            }
          done
          [[ -s prepared-release/release-notes.md ]] || {
            echo "missing release-notes.md" >&2
            exit 1
          }
          echo "expected artifacts present:"
          ls -1 prepared-release/

      - name: Generate and verify SHA256SUMS
        run: |
          set -euo pipefail
          (
            cd prepared-release
            sha256sum chronicle-*.tar.gz > SHA256SUMS
            test -s SHA256SUMS
            sha256sum -c SHA256SUMS
          )
          echo "SHA256SUMS verified"
          cat prepared-release/SHA256SUMS

      - name: Write release preparation summary
        env:
          MODE: ${{ needs.resolve-context.outputs.mode }}
          VERSION: ${{ needs.resolve-context.outputs.version }}
          TAG: ${{ needs.resolve-context.outputs.tag }}
          SHA: ${{ needs.resolve-context.outputs.sha }}
        run: |
          set -euo pipefail
          ARCHIVES=$(basename -a prepared-release/chronicle-*.tar.gz |\
            tr '\n' ' ')
          {
            echo "## Release preparation summary"
            echo ""
            echo "- Mode: ${MODE}"
            echo "- Resolved workspace version: ${VERSION}"
            echo "- Intended release tag: ${TAG}"
            echo "- Frozen release SHA: ${SHA}"
            echo "- Generated archives: ${ARCHIVES}"
            echo "- release-notes.md: present"
            echo "- SHA256SUMS: present and verified"
            if [[ "$MODE" == prepare ]]; then
              echo "- Publication: SKIPPED (prepare mode)"
              echo ""
              echo "Preparation completed successfully."
              echo "No tag or GitHub Release was created."
            else
              echo "- Tag promotion: deferred until preparation succeeds"
              echo "- Publication: deferred to create-tag and publish jobs"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload prepared release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prepared-release
          path: prepared-release
          if-no-files-found: error
          retention-days: 7

  create-tag:
    name: Promote immutable release tag
    if: needs.resolve-context.outputs.mode == 'release'
    needs: [resolve-context, release-qualification, prepare-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out frozen release candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}

      - name: Create or reuse tag at frozen SHA
        env:
          TAG: ${{ needs.resolve-context.outputs.tag }}
          SHA: ${{ needs.resolve-context.outputs.sha }}
        run: scripts/release/manage-release-state.sh ensure-tag "$TAG" "$SHA"

  publish:
    name: Create, verify, and publish GitHub Release
    if: needs.resolve-context.outputs.mode == 'release'
    needs: [resolve-context, create-tag, prepare-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.resolve-context.outputs.tag }}
      VERSION: ${{ needs.resolve-context.outputs.version }}
      SHA: ${{ needs.resolve-context.outputs.sha }}
      IS_PRERELEASE: ${{ needs.resolve-context.outputs.is-prerelease }}
    steps:
      - name: Download prepared release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: prepared-release
          path: .

      - name: Verify immutable tag before release mutation
        run: |
          set -euo pipefail
          tag_sha=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" \
            --jq '.object.sha')
          [[ "$tag_sha" == "$SHA" ]] || {
            echo "tag $TAG points to $tag_sha, expected frozen SHA $SHA" >&2
            exit 1
          }

      - name: Create or reuse draft release
        run: |
          set -euo pipefail
          release_draft() {
            local error value
            error=$(mktemp)
            if value=$(gh api "repos/$GH_REPO/releases/tags/$TAG" \
              --jq '.draft' 2>"$error"); then
              rm -f "$error"
              printf '%s' "$value"
              return 0
            fi
            if grep -Eq 'HTTP[^[:alnum:]]*404' "$error"; then
              rm -f "$error"
              return 0
            fi
            cat "$error" >&2
            rm -f "$error"
            return 1
          }

          current_draft=$(release_draft)
          if [[ -z "$current_draft" ]]; then
            release_flags=(--draft --title "Chronicle ${VERSION}" \
              --notes-file release-notes.md --verify-tag)
            if [[ "$IS_PRERELEASE" == true ]]; then
              release_flags+=(--prerelease)
            fi
            gh release create "$TAG" "${release_flags[@]}"
          else
            [[ "$current_draft" == true ]] || {
              echo "GitHub Release $TAG is already published;" \
                "refusing overwrite" >&2
              exit 1
            }
            if [[ "$IS_PRERELEASE" == true ]]; then
              gh release edit "$TAG" --notes-file release-notes.md --prerelease
            else
              gh release edit "$TAG" --notes-file release-notes.md \
                --prerelease=false
            fi
          fi

      - name: Upload or repair expected release assets
        run: |
          set -euo pipefail
          draft=$(gh release view "$TAG" --json isDraft \
            --jq '.isDraft')
          [[ "$draft" == true ]] || {
            echo "release $TAG is no longer a draft;" \
              "refusing asset mutation" >&2
            exit 1
          }
          gh release upload "$TAG" \
            "chronicle-${VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            "chronicle-${VERSION}-aarch64-unknown-linux-gnu.tar.gz" \
            SHA256SUMS --clobber

      - name: Verify draft assets and prerelease state
        run: |
          set -euo pipefail
          [[ "$(gh release view "$TAG" --json isDraft \
            --jq '.isDraft')" == true ]] || {
            echo "release $TAG is not a draft during verification" >&2
            exit 1
          }
          expected_prerelease=false
          if [[ "$IS_PRERELEASE" == true ]]; then
            expected_prerelease=true
          fi
          actual_prerelease=$(gh release view "$TAG" --json isPrerelease \
            --jq '.isPrerelease')
          [[ "$actual_prerelease" == "$expected_prerelease" ]] || {
            echo "release prerelease state mismatch:" \
              "$actual_prerelease != $expected_prerelease" >&2
            exit 1
          }
          assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          for expected in \
            "chronicle-${VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            "chronicle-${VERSION}-aarch64-unknown-linux-gnu.tar.gz" \
            SHA256SUMS; do
            grep -Fx -- "$expected" <<<"$assets" >/dev/null || {
              echo "release $TAG missing expected asset: $expected" >&2
              exit 1
            }
          done

      - name: Publish verified draft
        run: |
          set -euo pipefail
          release_id=$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq '.id')
          gh api --method PATCH \
            "repos/$GH_REPO/releases/$release_id" -F draft=false
          [[ "$(gh release view "$TAG" --json isDraft \
            --jq '.isDraft')" == false ]] || {
            echo "release $TAG did not leave draft state" >&2
            exit 1
          }

      - name: Write publication summary
        run: |
          {
            echo "## Release published"
            echo ""
            echo "- Tag: $TAG"
            echo "- Version: $VERSION"
            echo "- Frozen SHA: $SHA"
            echo "- Prerelease: $IS_PRERELEASE"
          } >> "$GITHUB_STEP_SUMMARY"
