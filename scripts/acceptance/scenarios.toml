schema_version = 1
runner_schema_version = 2
compatibility_version = 1

# Scenario IDs are the acceptance contract. Executors run these through one
# profile runtime; profiles only select capability coverage.
[profiles.live-capture]
scenarios = [
  "capture-basic",
  "wal-recovery",
  "replay",
  "user-intent-lifecycle",
  "documented-quickstart",
  "resource-cleanup",
]
execution_order = [
  "capture-basic",
  "wal-recovery",
  "replay",
  "user-intent-lifecycle",
  "documented-quickstart",
  "resource-cleanup",
]

[profiles.recorder]
scenarios = [
  "capture-basic",
  "wal-recovery",
  "replay",
  "resource-cleanup",
  "recorder-readiness",
  "incremental-etl",
  "continuation-rollover",
  "checkpoint-kill-restart",
  "quota-pressure",
  "retention-interruption",
  "corruption-quarantine",
  "reboot-recovery",
  "user-intent-lifecycle",
  "documented-quickstart",
]
execution_order = [
  "capture-basic",
  "recorder-readiness",
  "incremental-etl",
  "continuation-rollover",
  "quota-pressure",
  "checkpoint-kill-restart",
  "reboot-recovery",
  "wal-recovery",
  "corruption-quarantine",
  "replay",
  "retention-interruption",
  "user-intent-lifecycle",
  "documented-quickstart",
  "resource-cleanup",
]

[scenarios.capture-basic]
timeout_seconds = 900
capabilities = ["privileged", "ebpf"]
phases = ["environment", "capture"]
legacy_live_capture_checks = ["privileged_acceptance"]
legacy_recorder_checks = ["systemd_type_simple", "three_epochs"]

[scenarios.wal-recovery]
timeout_seconds = 300
capabilities = ["privileged", "wal"]
phases = ["capture", "recovery"]
legacy_live_capture_checks = [
] # portable WAL/ingest matrices are separate gate prerequisites (8.1)
legacy_recorder_checks = [
  "checkpoint_output_committed_checkpoint_missing",
  "checkpoint_committed_status_missing",
]

[scenarios.replay]
timeout_seconds = 300
capabilities = ["privileged", "replay"]
phases = ["replay"]
legacy_live_capture_checks = [
] # portable replay matrix is a separate gate prerequisite (8.1)
legacy_recorder_checks = ["inspect_replay", "one_shot_equivalence"]

[scenarios.user-intent-lifecycle]
timeout_seconds = 600
capabilities = ["privileged", "ebpf", "cgroup-v2", "replay"]
phases = ["record", "retry", "selectors", "replay", "cleanup"]
legacy_live_capture_checks = ["user_intent_lifecycle"]

[scenarios.documented-quickstart]
timeout_seconds = 600
capabilities = ["privileged", "ebpf", "cgroup-v2", "replay"]
phases = ["doctor", "record", "list", "inspect", "replay"]

[scenarios.resource-cleanup]
timeout_seconds = 900
capabilities = ["privileged", "cleanup"]
phases = ["cleanup"]
legacy_live_capture_checks = [
  "privileged_signal",
] # portable cgroup/fmt/workspace are separate gate prerequisites (8.1)
legacy_recorder_checks = ["resource_cleanup", "signal_shutdown"]

[scenarios.recorder-readiness]
timeout_seconds = 300
capabilities = ["privileged", "systemd", "cgroup-v2", "btf"]
phases = ["readiness"]
legacy_recorder_checks = ["incremental_worker", "process_restart_readiness"]

[scenarios.incremental-etl]
timeout_seconds = 300
capabilities = ["privileged", "etl"]
phases = ["incremental", "finalization"]
legacy_recorder_checks = [
  "incremental_worker",
  "standalone_etl_live_rejection",
  "one_shot_equivalence",
]

[scenarios.continuation-rollover]
timeout_seconds = 600
capabilities = ["privileged", "continuation", "etl", "replay", "bounded-state", "invalid-continuation", "multiple-etl-lags"]
phases = ["rollover", "continuation", "lineage", "invalid-continuation"]

[scenarios.checkpoint-kill-restart]
timeout_seconds = 300
capabilities = ["privileged", "crash-recovery"]
phases = ["checkpoint_crash_matrix"]
legacy_recorder_checks = [
  "checkpoint_output_committed_checkpoint_missing",
  "checkpoint_committed_status_missing",
]

[scenarios.quota-pressure]
timeout_seconds = 600
capabilities = ["privileged", "quota"]
phases = ["quota_pressure"]
legacy_recorder_checks = [
  "quota_exhaustion_admission",
  "quota_restart_accounting",
  "quota_recovery_after_space",
  "minimum_free_enforcement",
  "minimum_free_recovery",
]

[scenarios.retention-interruption]
timeout_seconds = 600
capabilities = ["privileged", "retention", "crash-recovery"]
phases = ["cleanup_recovery"]
legacy_recorder_checks = [
  "cleanup_interrupted_recovery",
  "cleanup_protected_lineage",
  "cleanup_restart_consistency",
]

[scenarios.corruption-quarantine]
timeout_seconds = 300
capabilities = ["privileged", "corruption"]
phases = ["corruption"]
legacy_recorder_checks = [
  "corruption_fail_closed",
  "corruption_evidence_preservation",
]

[scenarios.reboot-recovery]
timeout_seconds = 300
capabilities = ["privileged", "reboot", "persistent-state"]
phases = ["pre_reboot", "post_reboot"]
legacy_recorder_checks = ["pre_reboot_persistence", "host_reboot_recovery"]
