repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files

  - repo: https://github.com/doublify/pre-commit-rust
    rev: v1.0
    hooks:
      - id: fmt
      - id: clippy
        args: ["--all-targets", "--", "-D", "warnings"]

  - repo: local
    hooks:
      - id: pre-push-act
        name: pre-push act validation
        description: Run the portable CI checks job locally with act
        entry: scripts/pre-push-validation.sh
        language: system
        pass_filenames: false
        stages: [push]
